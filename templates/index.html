<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indiana Sports Calendar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>Indiana Sports Calendar</h1>
    <div class="version">Version 0.2</div>
</header>

<nav class="toolbar">
    <button>◀ Previous</button>
    <button>Today</button>
    <button>Next ▶</button>
    <button>- Zoom</button>
    <button>+ Zoom</button>

    <input type="text" placeholder="Search...">
</nav>

<section class="filters">
    <label><input type="checkbox" checked> Colts</label>
    <label><input type="checkbox" checked> Pacers</label>
    <label><input type="checkbox" checked> Fever</label>
    <label><input type="checkbox" checked> Purdue</label>
    <label><input type="checkbox" checked> Indiana</label>
    <label><input type="checkbox" checked> Notre Dame</label>
    <label><input type="checkbox" checked> Butler</label>
    <label><input type="checkbox" checked> IndyCar</label>
</section>

<section class="timeline">

    <div class="months">
        <div>Jan</div>
        <div>Feb</div>
        <div>Mar</div>
        <div>Apr</div>
        <div>May</div>
        <div>Jun</div>
        <div>Jul</div>
        <div>Aug</div>
        <div>Sep</div>
        <div>Oct</div>
        <div>Nov</div>
        <div>Dec</div>
    </div>

    {% for game in schedule %}
    <div class="schedule-row">

        <div class="team-name">
            {{ game.Team }}
        </div>

        <div class="game-info">
            <strong>{{ game.Date }}</strong>
            &nbsp; {{ game.Time }}
            &nbsp; vs. {{ game.Opponent }}
            &nbsp; — {{ game.HomeAway }}
            <br>
            <small>
                {{ game.Venue }}, {{ game.City }}, {{ game.State }}
            </small>
        </div>

    </div>
    {% endfor %}

</section>

</body>
</html>
